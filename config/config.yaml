testing:
  sampling:
    measurements_count: 20
    total_duration_seconds: null
    sampling_frequency_hz: 2.0

ammeters:
  greenlee:
    driver: "src.drivers.greenlee.GreenleeDriver"
    host: "localhost"
    port: 5000
    command: "MEASURE_GREENLEE -get_measurement"
    timeout_seconds: 2.0
    retries: 3
    retry_backoff_seconds: 0.5
  entes:
    driver: "src.drivers.entes.EntesDriver"
    host: "localhost"
    port: 5001
    command: "MEASURE_ENTES -get_data"
    timeout_seconds: 2.0
    retries: 3
    retry_backoff_seconds: 0.5
  circutor:
    driver: "src.drivers.circutor.CircutorDriver"
    host: "localhost"
    port: 5002
    command: "MEASURE_CIRCUTOR -get_measurement -current"
    timeout_seconds: 2.0
    retries: 3
    retry_backoff_seconds: 0.5

analysis:
  statistical_metrics:
    - mean
    - median
    - stdev
    - min
    - max
    - coefficient_of_variation
    - failure_rate
  outlier_detection:
    method: "iqr"
    iqr_multiplier: 1.5
    min_samples_for_detection: 4
  visualization:
    enabled: true
    plot_types: []

result_management:
  results_dir: "results"
  runs_subdir: "runs"
  index_filename: "index.json"

fault_injection:
  enabled: false
  fault_rate: 0.25
  seed: 1234
  fault_types:
    - "timeout"
    - "disconnect"
    - "corrupted_response"
    - "negative_value"
  injected_timeout_seconds: 2.5
